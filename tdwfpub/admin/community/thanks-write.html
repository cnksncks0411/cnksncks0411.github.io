<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>화물복지재단 관리자</title>
    <link rel="icon" href="/tdwfpub/common/images/favicon.ico" sizes="any" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link rel="stylesheet" href="/tdwfpub/admin/css/admin.css" />
  </head>
  <body data-site="admin" data-section="community" data-page="thanks">
    <a href="#admin-content" class="skip-link">본문 바로가기</a>

    <div id="wrap">
      <!-- 관리자 공통 헤더 인클루드 영역: /admin/include/header.html 파일을 불러옵니다. -->
      <div id="include-admin-header" data-include="header"></div>

      <div class="admin-content-wrap" data-layout-body>
        <!-- 공통관리 좌측 메뉴 인클루드 영역: /admin/include/lnb-community.html 파일을 불러옵니다. -->
        <div id="include-admin-lnb" data-include="lnb-community" data-page="thanks"></div>

        <main id="admin-content" data-content>
          <!-- 열린 관리자 페이지 탭 렌더링 영역: 저장된 탭이 있을 때 admin.js에서 목록을 출력합니다. -->
          <nav class="tab-bar" data-tabs data-tab-bar aria-label="열린 관리자 페이지" hidden></nav>

          <div class="content-wrap">
            <div class="page-title">
              <!-- 수정인 경우 글수정으로 변경 -->
              <h1>글쓰기</h1>
              <nav class="breadcrumb" aria-label="현재 위치">
                <a href="/tdwfpub/admin/admin-main.html">Home</a>
                <span class="material-symbols-rounded" aria-hidden="true">chevron_forward</span>
                <a href="/tdwfpub/admin/community/thanks-list.html">공통관리</a>
                <span class="material-symbols-rounded" aria-hidden="true">chevron_forward</span>
                <a href="/tdwfpub/admin/community/thanks-list.html">감사의글</a>
                <span class="material-symbols-rounded" aria-hidden="true">chevron_forward</span>
                <!-- 수정인 경우 글수정으로 변경 -->
                <span aria-current="page">글쓰기</span>
              </nav>
            </div>

            <section class="panel" aria-labelledby="write-form-title">
              <h2 id="write-form-title" hidden>감사의글 글쓰기 입력폼</h2>
              <form action="/tdwfpub/admin/community/thanks-list.html" method="post" enctype="multipart/form-data">
                <table class="board-form-table">
                  <tbody>
                    <tr>
                      <th scope="row">아이디</th>
                      <td>admin</td>
                    </tr>
                    <tr>
                      <th scope="row">작성자</th>
                      <td>관리자</td>
                    </tr>
                    <tr>
                      <th scope="row">제목</th>
                      <td>
                        <input
                          class="form-control"
                          type="text"
                          name="title"
                          aria-label="제목"
                          placeholder="제목을 입력하세요."
                          required
                        />
                      </td>
                    </tr>
                    <tr>
                      <th scope="row">공개여부</th>
                      <td>
                        <div class="board-form-options">
                          <label class="radio-label">
                            <input type="radio" name="open" value="true" checked />
                            <span class="radio-label-text">공개</span>
                          </label>
                          <label class="radio-label">
                            <input type="radio" name="open" value="false" />
                            <span class="radio-label-text">비공개</span>
                          </label>
                        </div>
                      </td>
                    </tr>
                    <tr>
                      <th scope="row">내용</th>
                      <td>
                        <!-- 에디터 연결 위치 -->
                        <textarea class="textarea" name="content" rows="10" aria-label="내용" required></textarea>
                      </td>
                    </tr>
                  </tbody>
                </table>

                <div class="board-form-actions">
                  <!-- 수정인 경우 수정하기로 변경 -->
                  <button type="submit" class="btn variant-solid color-navy rounded-md size-board-action">
                    등록하기
                  </button>
                  <a href="/tdwfpub/admin/community/thanks-list.html" class="btn variant-outline color-navy rounded-md size-board-action">
                    취소하기
                  </a>
                </div>
              </form>
            </section>
          </div>
        </main>
      </div>

      <!-- 관리자 공통 푸터 인클루드 영역: /admin/include/footer.html 파일을 불러옵니다. -->
      <div id="include-admin-footer" data-include="footer"></div>
    </div>
    <script src="/tdwfpub/admin/js/include.js"></script>
    <script src="/tdwfpub/admin/js/form.js"></script>
    <script src="/tdwfpub/admin/js/admin.js"></script>
  </body>
</html>
