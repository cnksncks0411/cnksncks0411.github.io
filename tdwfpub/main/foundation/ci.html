              <div class="sub-intro">
                <strong
                  >화물복지재단의 심볼마크는 <br /><em>화물운전자의 복지향상과 번영을 위해 설립된</em> 재단의

                <div>
                  <img src="/common/images/contents/ci_01.jpg">
                </div>
                <p>
                  화물운전자에게 친근한 이미지로 다가가는 화물복지재단을 형상화한 심벌입니다.<br /><br />
                  화물복지재단에서 'ㅎ'과 'ㅁ'을 모티브로 트럭을 형상화 하였습니다. 초록색은 복지, 주황색은 번영,
                  하늘색은 소통을 의미합니다. 굵은선은 재단의 단단함을, 곡선은 화물운전자를 따뜻하게 감싸주는 재단을
                  표현하였습니다.
                </p>
