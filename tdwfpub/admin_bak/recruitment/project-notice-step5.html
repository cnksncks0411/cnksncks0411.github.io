<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>사업공고 등록(화물운전자 정보) | 화물복지재단 관리자</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link rel="stylesheet" href="/tdwfpub/admin_bak/css/admin.css" />
  </head>
  <body data-site="admin" data-section="recruitment" data-page="project-notice">
    <a href="#admin-content" class="skip-link">본문 바로가기</a>

    <div id="wrap">
      <!-- 관리자 공통 헤더 인클루드 영역: /admin_bak/include/header.html 파일을 불러옵니다. -->
      <div id="include-admin-header" data-include="header"></div>

      <div class="admin-content-wrap" data-layout-body>
        <!-- 사업공고 및 마감 좌측 메뉴 인클루드 영역: /admin_bak/include/lnb-recruitment.html 파일을 불러옵니다. -->
        <div id="include-admin-lnb" data-include="lnb-recruitment" data-page="project-notice"></div>

        <main id="admin-content" data-content>
          <!-- 열린 관리자 페이지 탭 렌더링 영역: 저장된 탭이 있을 때 admin.js에서 목록을 출력합니다. -->
          <nav class="tab-bar" data-tabs data-tab-bar aria-label="열린 관리자 페이지" hidden></nav>

          <div class="content-wrap">
            <div class="page-title">
              <h1>사업공고 등록</h1>
              <nav class="breadcrumb" aria-label="현재 위치">
                <a href="/tdwfpub/admin_bak/admin-main.html">Home</a>
                <span class="material-symbols-rounded" aria-hidden="true">chevron_forward</span>
                <a href="/tdwfpub/admin_bak/recruitment/project-notice-list.html">사업공고 및 마감</a>
                <span class="material-symbols-rounded" aria-hidden="true">chevron_forward</span>
                <a href="/tdwfpub/admin_bak/recruitment/project-notice-list.html">사업공고 관리</a>
                <span class="material-symbols-rounded" aria-hidden="true">chevron_forward</span>
                <span aria-current="page">사업공고 등록</span>
              </nav>
            </div>

            <section class="panel" aria-labelledby="driver-information-title">
              <form method="post">
                <div class="board-info-row">
                  <h2 class="board-list-title" id="driver-information-title">화물운전자 정보</h2>
                </div>

                <table class="board-form-table board-item-table">
                  <caption>
                    화물운전자 정보 항목 사용 여부
                  </caption>
                  <colgroup>
                    <col width="25%" />
                    <col width="25%" />
                    <col width="25%" />
                    <col width="25%" />
                  </colgroup>
                  <thead>
                    <tr>
                      <th scope="col">항목</th>
                      <th scope="col">사용 여부</th>
                      <th scope="col">항목</th>
                      <th scope="col">사용 여부</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <th scope="row">성명</th>
                      <td>
                        <div class="board-form-options justify-center">
                          <label class="radio-label">
                            <input type="radio" name="driverNameUse" value="true" checked />
                            <span class="radio-label-text">사용</span>
                          </label>
                          <label class="radio-label">
                            <input type="radio" name="driverNameUse" value="false" />
                            <span class="radio-label-text">미사용</span>
                          </label>
                        </div>
                      </td>
                      <th scope="row">업종</th>
                      <td>
                        <div class="board-form-options justify-center">
                          <label class="radio-label">
                            <input type="radio" name="businessTypeUse" value="true" checked />
                            <span class="radio-label-text">사용</span>
                          </label>
                          <label class="radio-label">
                            <input type="radio" name="businessTypeUse" value="false" />
                            <span class="radio-label-text">미사용</span>
                          </label>
                        </div>
                      </td>
                    </tr>
                    <tr>
                      <th scope="row">생년월일</th>
                      <td>
                        <div class="board-form-options justify-center">
                          <label class="radio-label">
                            <input type="radio" name="birthDateUse" value="true" checked />
                            <span class="radio-label-text">사용</span>
                          </label>
                          <label class="radio-label">
                            <input type="radio" name="birthDateUse" value="false" />
                            <span class="radio-label-text">미사용</span>
                          </label>
                        </div>
                      </td>
                      <th scope="row">경력</th>
                      <td>
                        <div class="board-form-options justify-center">
                          <label class="radio-label">
                            <input type="radio" name="careerUse" value="true" />
                            <span class="radio-label-text">사용</span>
                          </label>
                          <label class="radio-label">
                            <input type="radio" name="careerUse" value="false" checked />
                            <span class="radio-label-text">미사용</span>
                          </label>
                        </div>
                      </td>
                    </tr>
                    <tr>
                      <th scope="row">차종</th>
                      <td>
                        <div class="board-form-options justify-center">
                          <label class="radio-label">
                            <input type="radio" name="vehicleTypeUse" value="true" checked />
                            <span class="radio-label-text">사용</span>
                          </label>
                          <label class="radio-label">
                            <input type="radio" name="vehicleTypeUse" value="false" />
                            <span class="radio-label-text">미사용</span>
                          </label>
                        </div>
                      </td>
                      <th scope="row">자택주소</th>
                      <td>
                        <div class="board-form-options justify-center">
                          <label class="radio-label">
                            <input type="radio" name="homeAddressUse" value="true" checked />
                            <span class="radio-label-text">사용</span>
                          </label>
                          <label class="radio-label">
                            <input type="radio" name="homeAddressUse" value="false" />
                            <span class="radio-label-text">미사용</span>
                          </label>
                        </div>
                      </td>
                    </tr>
                    <tr>
                      <th scope="row">차량톤수</th>
                      <td>
                        <div class="board-form-options justify-center">
                          <label class="radio-label">
                            <input type="radio" name="vehicleTonnageUse" value="true" checked />
                            <span class="radio-label-text">사용</span>
                          </label>
                          <label class="radio-label">
                            <input type="radio" name="vehicleTonnageUse" value="false" />
                            <span class="radio-label-text">미사용</span>
                          </label>
                        </div>
                      </td>
                      <th scope="row">휴대폰번호</th>
                      <td>
                        <div class="board-form-options justify-center">
                          <label class="radio-label">
                            <input type="radio" name="mobilePhoneUse" value="true" checked />
                            <span class="radio-label-text">사용</span>
                          </label>
                          <label class="radio-label">
                            <input type="radio" name="mobilePhoneUse" value="false" />
                            <span class="radio-label-text">미사용</span>
                          </label>
                        </div>
                      </td>
                    </tr>
                    <tr>
                      <th scope="row">차량번호</th>
                      <td>
                        <div class="board-form-options justify-center">
                          <label class="radio-label">
                            <input type="radio" name="vehicleNumberUse" value="true" checked />
                            <span class="radio-label-text">사용</span>
                          </label>
                          <label class="radio-label">
                            <input type="radio" name="vehicleNumberUse" value="false" />
                            <span class="radio-label-text">미사용</span>
                          </label>
                        </div>
                      </td>
                      <th scope="row">긴급번호</th>
                      <td>
                        <div class="board-form-options justify-center">
                          <label class="radio-label">
                            <input type="radio" name="emergencyPhoneUse" value="true" />
                            <span class="radio-label-text">사용</span>
                          </label>
                          <label class="radio-label">
                            <input type="radio" name="emergencyPhoneUse" value="false" checked />
                            <span class="radio-label-text">미사용</span>
                          </label>
                        </div>
                      </td>
                    </tr>
                    <tr>
                      <th scope="row">회사상호</th>
                      <td>
                        <div class="board-form-options justify-center">
                          <label class="radio-label">
                            <input type="radio" name="companyNameUse" value="true" checked />
                            <span class="radio-label-text">사용</span>
                          </label>
                          <label class="radio-label">
                            <input type="radio" name="companyNameUse" value="false" />
                            <span class="radio-label-text">미사용</span>
                          </label>
                        </div>
                      </td>
                      <th scope="row">자택전화번호</th>
                      <td>
                        <div class="board-form-options justify-center">
                          <label class="radio-label">
                            <input type="radio" name="homePhoneUse" value="true" checked />
                            <span class="radio-label-text">사용</span>
                          </label>
                          <label class="radio-label">
                            <input type="radio" name="homePhoneUse" value="false" />
                            <span class="radio-label-text">미사용</span>
                          </label>
                        </div>
                      </td>
                    </tr>
                    <tr>
                      <td colspan="2"></td>
                      <th scope="row">이메일</th>
                      <td>
                        <div class="board-form-options justify-center">
                          <label class="radio-label">
                            <input type="radio" name="emailUse" value="true" />
                            <span class="radio-label-text">사용</span>
                          </label>
                          <label class="radio-label">
                            <input type="radio" name="emailUse" value="false" checked />
                            <span class="radio-label-text">미사용</span>
                          </label>
                        </div>
                      </td>
                    </tr>
                  </tbody>
                </table>

                <div class="board-form-actions">
                  <a
                    href="/tdwfpub/admin_bak/recruitment/project-notice-step4.html"
                    class="btn variant-solid color-blue rounded-md size-board-action mr-auto"
                  >
                    이전단계
                  </a>
                  <!-- 
                    퍼블리싱용 화면 이동 버튼입니다.
                    개발 연동 시 아래 주석 처리된 버튼 사용해주세요.
                  -->
                  <a
                    href="/tdwfpub/admin_bak/recruitment/project-notice-step6.html"
                    class="btn variant-solid color-navy rounded-md size-board-auto"
                  >
                    저장 후 다음단계
                  </a>
                  <!-- <button type="button" class="btn variant-solid color-navy rounded-md size-board-auto">
                    저장 후 다음단계
                  </button> -->
                  <a
                    href="/tdwfpub/admin_bak/recruitment/project-notice-list.html"
                    class="btn variant-outline color-navy rounded-md size-board-action"
                  >
                    취소하기
                  </a>
                </div>
              </form>
            </section>
          </div>
        </main>
      </div>

      <!-- 관리자 공통 푸터 인클루드 영역: /admin_bak/include/footer.html 파일을 불러옵니다. -->
      <div id="include-admin-footer" data-include="footer"></div>
    </div>
    <script src="/tdwfpub/admin_bak/js/include.js"></script>
    <script src="/tdwfpub/admin_bak/js/admin.js"></script>
  </body>
</html>
