<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>화물복지재단 관리자</title>
    <link rel="icon" href="/tdwfpub/common/images/favicon.ico" sizes="any" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link rel="stylesheet" href="/tdwfpub/admin/css/admin.css" />
  </head>
  <body data-site="admin" data-section="followup-ended" data-page="loan-fee">
    <a href="#admin-content" class="skip-link">본문 바로가기</a>

    <div id="wrap">
      <!-- 관리자 공통 헤더 인클루드 영역: /admin/include/header.html 파일을 불러옵니다. -->
      <div id="include-admin-header" data-include="header"></div>

      <div class="admin-content-wrap" data-layout-body>
        <!-- 실적관리(종료사업) 좌측 메뉴 인클루드 영역: /admin/include/lnb-followup-ended.html 파일을 불러옵니다. -->
        <div id="include-admin-lnb" data-include="lnb-followup-ended" data-page="loan-fee"></div>

        <main id="admin-content" data-content>
          <!-- 열린 관리자 페이지 탭 렌더링 영역: 저장된 탭이 있을 때 admin.js에서 목록을 출력합니다. -->
          <nav class="tab-bar" data-tabs data-tab-bar aria-label="열린 관리자 페이지" hidden></nav>

          <div class="content-wrap">
            <div class="page-title">
              <h1>대출보증(수수료정산)</h1>
              <nav class="breadcrumb" aria-label="현재 위치">
                <a href="/tdwfpub/admin/admin-main.html">Home</a>
                <span class="material-symbols-rounded" aria-hidden="true">chevron_forward</span>
                <a href="/tdwfpub/admin/followup-ended/loan-fee-list.html">실적관리(종료사업)</a>
                <span class="material-symbols-rounded" aria-hidden="true">chevron_forward</span>
                <span aria-current="page">대출보증(수수료정산)</span>
              </nav>
            </div>

            <section class="panel" aria-label="수수료정산이력 등록 및 수정">
              <form action="/tdwfpub/admin/followup-ended/loan-fee-view.html" method="post" class="flex flex-col gap-4">
                <section class="board-section" aria-labelledby="loan-fee-date-title">
                  <h2 class="board-section-title" id="loan-fee-date-title">날짜정보</h2>
                  <table class="board-form-table">
                    <caption>
                      수수료정산 날짜정보
                    </caption>
                    <colgroup>
                      <col width="20%" />
                      <col width="80%" />
                    </colgroup>
                    <tbody>
                      <tr>
                        <th scope="row"><label for="loanFeeSettlementMonth">정산년월일</label></th>
                        <td>
                          <input
                            type="text"
                            id="loanFeeSettlementMonth"
                            name="loanFeeSettlementMonth"
                            class="form-control w-quarter"
                            value="202406"
                            readonly
                          />
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </section>

                <section class="board-section" aria-labelledby="loan-fee-round-title">
                  <h2 class="board-section-title" id="loan-fee-round-title">회차정보</h2>
                  <div class="board-table-wrap">
                    <table class="board-form-table">
                      <caption>
                        수수료정산 회차정보
                      </caption>
                      <colgroup>
                        <col width="20%" />
                        <col width="26%" />
                        <col width="28%" />
                        <col width="26%" />
                      </colgroup>
                      <thead>
                        <tr>
                          <th scope="col">정산회차</th>
                          <th scope="col">회차건수</th>
                          <th scope="col">대출취급액</th>
                          <th scope="col">회차수수료</th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr>
                          <th scope="row">1회차</th>
                          <td>
                            <input
                              type="text"
                              name="loanFeeFirstCount"
                              class="form-control w-full"
                              value="0"
                              aria-label="1회차 회차건수"
                              readonly
                            />
                          </td>
                          <td>
                            <input
                              type="text"
                              name="loanFeeFirstAmount"
                              class="form-control w-full"
                              value="0"
                              aria-label="1회차 대출취급액"
                              readonly
                            />
                          </td>
                          <td>
                            <input
                              type="text"
                              name="loanFeeFirstFee"
                              class="form-control w-full"
                              value="0"
                              aria-label="1회차 회차수수료"
                              readonly
                            />
                          </td>
                        </tr>
                        <tr>
                          <th scope="row">2회차</th>
                          <td>
                            <input
                              type="text"
                              name="loanFeeSecondCount"
                              class="form-control w-full"
                              value="26"
                              aria-label="2회차 회차건수"
                              readonly
                            />
                          </td>
                          <td>
                            <input
                              type="text"
                              name="loanFeeSecondAmount"
                              class="form-control w-full"
                              value="2,728,841,599"
                              aria-label="2회차 대출취급액"
                              readonly
                            />
                          </td>
                          <td>
                            <input
                              type="text"
                              name="loanFeeSecondFee"
                              class="form-control w-full"
                              value="2,728,840"
                              aria-label="2회차 회차수수료"
                              readonly
                            />
                          </td>
                        </tr>
                        <tr>
                          <th scope="row">3회차</th>
                          <td>
                            <input
                              type="text"
                              name="loanFeeThirdCount"
                              class="form-control w-full"
                              value="64"
                              aria-label="3회차 회차건수"
                              readonly
                            />
                          </td>
                          <td>
                            <input
                              type="text"
                              name="loanFeeThirdAmount"
                              class="form-control w-full"
                              value="4,561,760,422"
                              aria-label="3회차 대출취급액"
                              readonly
                            />
                          </td>
                          <td>
                            <input
                              type="text"
                              name="loanFeeThirdFee"
                              class="form-control w-full"
                              value="4,561,760"
                              aria-label="3회차 회차수수료"
                              readonly
                            />
                          </td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </section>

                <section class="board-section" aria-labelledby="loan-fee-settlement-title">
                  <h2 class="board-section-title" id="loan-fee-settlement-title">정산정보</h2>
                  <table class="board-form-table">
                    <caption>
                      수수료 정산정보
                    </caption>
                    <colgroup>
                      <col width="16%" />
                      <col width="34%" />
                      <col width="16%" />
                      <col width="34%" />
                    </colgroup>
                    <tbody>
                      <tr>
                        <th scope="row"><label for="loanFeeMonthlyRefund">월환급액</label></th>
                        <td>
                          <input
                            type="text"
                            id="loanFeeMonthlyRefund"
                            name="loanFeeMonthlyRefund"
                            class="form-control w-full"
                            value="0"
                            readonly
                          />
                        </td>
                        <th scope="row"><label for="loanFeeMonthlyDeposit">월입금액</label></th>
                        <td>
                          <input
                            type="text"
                            id="loanFeeMonthlyDeposit"
                            name="loanFeeMonthlyDeposit"
                            class="form-control w-full"
                            value="7,290,600"
                            readonly
                          />
                        </td>
                      </tr>
                      <tr>
                        <th scope="row"><label for="loanFeeAccumulatedAmount">누적금액</label></th>
                        <td>
                          <input
                            type="text"
                            id="loanFeeAccumulatedAmount"
                            name="loanFeeAccumulatedAmount"
                            class="form-control w-full"
                            value="1,214,116,930"
                            readonly
                          />
                        </td>
                        <th scope="row"><label for="loanFeeDepositDate">입금일</label></th>
                        <td>
                          <input
                            type="text"
                            id="loanFeeDepositDate"
                            name="loanFeeDepositDate"
                            class="form-control w-full"
                            value="2024-07-25"
                            readonly
                          />
                        </td>
                      </tr>
                      <tr>
                        <th scope="row"><label for="loanFeeBalanceAmount">잔고금액</label></th>
                        <td colspan="3">
                          <input
                            type="text"
                            id="loanFeeBalanceAmount"
                            name="loanFeeBalanceAmount"
                            class="form-control w-full"
                            value="393,337,637"
                            readonly
                          />
                        </td>
                      </tr>
                      <tr>
                        <th scope="row"><label for="loanFeeMemo">메모</label></th>
                        <td colspan="3">
                          <textarea id="loanFeeMemo" name="loanFeeMemo" class="textarea" rows="6">1회차 수수료(24.6.1~30)은 신규대출 중단으로 입금 내역 없음</textarea>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </section>

                <div class="board-form-actions justify-center">
                  <button type="submit" class="btn variant-solid color-navy rounded-md size-board-auto">
                    저장하기
                  </button>
                  <a
                    href="/tdwfpub/admin/followup-ended/loan-fee-list.html"
                    class="btn variant-outline color-navy rounded-md size-board-auto"
                  >
                    닫기
                  </a>
                </div>
              </form>
            </section>
          </div>
        </main>
      </div>

      <!-- 관리자 공통 푸터 인클루드 영역: /admin/include/footer.html 파일을 불러옵니다. -->
      <div id="include-admin-footer" data-include="footer"></div>
    </div>
    <script src="/tdwfpub/admin/js/include.js"></script>
    <script src="/tdwfpub/admin/js/admin.js"></script>
  </body>
</html>
