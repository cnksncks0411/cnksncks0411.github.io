<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>신청자 서류등록 | 화물복지재단 관리자</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link rel="stylesheet" href="/tdwfpub/admin_bak/css/admin.css" />
  </head>
  <body data-site="admin" data-section="recruitment" data-page="applicant-doc">
    <a href="#admin-content" class="skip-link">본문 바로가기</a>

    <div id="wrap">
      <!-- 관리자 공통 헤더 인클루드 영역: /admin_bak/include/header.html 파일을 불러옵니다. -->
      <div id="include-admin-header" data-include="header"></div>

      <div class="admin-content-wrap" data-layout-body>
        <!-- 사업공고 및 마감 좌측 메뉴 인클루드 영역: /admin_bak/include/lnb-recruitment.html 파일을 불러옵니다. -->
        <div id="include-admin-lnb" data-include="lnb-recruitment" data-page="applicant-doc"></div>

        <main id="admin-content" data-content>
          <!-- 열린 관리자 페이지 탭 렌더링 영역: 저장된 탭이 있을 때 admin.js에서 목록을 출력합니다. -->
          <nav class="tab-bar" data-tabs data-tab-bar aria-label="열린 관리자 페이지" hidden></nav>

          <div class="content-wrap">
            <div class="page-title">
              <h1>신청자 서류등록</h1>
              <nav class="breadcrumb" aria-label="현재 위치">
                <a href="/tdwfpub/admin_bak/admin-main.html">Home</a>
                <span class="material-symbols-rounded" aria-hidden="true">chevron_forward</span>
                <a href="/tdwfpub/admin_bak/recruitment/project-notice-list.html">사업공고 및 마감</a>
                <span class="material-symbols-rounded" aria-hidden="true">chevron_forward</span>
                <a href="/tdwfpub/admin_bak/recruitment/applicant-doc-list.html">신청자 서류등록</a>
                <span class="material-symbols-rounded" aria-hidden="true">chevron_forward</span>
                <span aria-current="page">등록 서류목록</span>
              </nav>
            </div>

            <section class="panel flex flex-col gap-4" aria-label="신청자 등록 서류">
              <section class="board-section" aria-labelledby="applicant-registered-document-title">
                <div class="board-info-row">
                  <h2 class="board-list-title" id="applicant-registered-document-title">등록 서류목록</h2>
                  <div class="board-info-actions">
                    <button type="button" class="btn variant-outline color-navy rounded-md size-board-auto">
                      <span class="material-symbols-rounded" aria-hidden="true">download</span>
                      일괄다운로드
                    </button>
                    <a
                      href="/tdwfpub/admin_bak/recruitment/applicant-doc-list.html"
                      class="btn variant-outline color-navy rounded-md size-board-auto"
                    >
                      목록
                    </a>
                  </div>
                </div>

                <!-- 목록 없는 경우: hidden 속성을 제거하고 표시 -->
                <p class="board-content-empty" hidden>등록된 첨부파일이 없습니다.</p>
                <ul class="board-document-grid">
                  <li class="board-document-item">
                    <figure class="board-document-card">
                      <a
                        href="/tdwfpub/common/images/main/info-image.png"
                        class="board-document-thumb"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="파일 새창열기"
                      >
                        <img src="/tdwfpub/common/images/main/info-image.png" alt="" />
                      </a>
                      <figcaption class="board-document-name">재학증명서_1.jpg</figcaption>
                      <div class="board-table-actions">
                        <a
                          href="/tdwfpub/common/images/main/info-image.png"
                          class="btn variant-outline color-navy rounded-md size-sm"
                          download
                        >
                          다운로드
                        </a>
                        <button type="button" class="btn variant-soft color-red rounded-md size-sm">삭제</button>
                      </div>
                    </figure>
                  </li>
                  <li class="board-document-item">
                    <figure class="board-document-card">
                      <a
                        href="/tdwfpub/common/images/main/info-image.png"
                        class="board-document-thumb"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="파일 새창열기"
                      >
                        <img src="/tdwfpub/common/images/main/info-image.png" alt="" />
                      </a>
                      <figcaption class="board-document-name">재학증명서_2.jpg</figcaption>
                      <div class="board-table-actions">
                        <a
                          href="/tdwfpub/common/images/main/info-image.png"
                          class="btn variant-outline color-navy rounded-md size-sm"
                          download
                        >
                          다운로드
                        </a>
                        <button type="button" class="btn variant-soft color-red rounded-md size-sm">삭제</button>
                      </div>
                    </figure>
                  </li>
                </ul>
              </section>

              <section class="board-section" aria-labelledby="applicant-document-list-title">
                <h2 class="board-section-title" id="applicant-document-list-title">서류목록</h2>
                <form action="" method="post" enctype="multipart/form-data">
                  <table class="board-form-table">
                    <caption>
                      신청자 서류 파일 등록
                    </caption>
                    <colgroup>
                      <col width="22%" />
                      <col width="78%" />
                    </colgroup>
                    <tbody>
                      <tr>
                        <th scope="row">
                          <label for="applicantDocumentFile1"> 재학증명서_1<span class="required-mark">*</span> </label>
                        </th>
                        <td>
                          <div class="flex items-center gap-2 row-type-file">
                            <input
                              id="applicantDocumentFile1"
                              name="applicantDocumentFile1"
                              type="file"
                              class="form-control"
                            />
                            <button
                              type="submit"
                              name="documentType"
                              value="studentCertificate1"
                              class="btn variant-solid color-navy rounded-md size-input"
                            >
                              저장
                            </button>
                          </div>
                        </td>
                      </tr>
                      <tr>
                        <th scope="row">
                          <label for="applicantDocumentFile2"> 재학증명서_2<span class="required-mark">*</span> </label>
                        </th>
                        <td>
                          <div class="flex items-center gap-2 row-type-file">
                            <input
                              id="applicantDocumentFile2"
                              name="applicantDocumentFile2"
                              type="file"
                              class="form-control"
                            />
                            <button
                              type="submit"
                              name="documentType"
                              value="studentCertificate2"
                              class="btn variant-solid color-navy rounded-md size-input"
                            >
                              저장
                            </button>
                          </div>
                        </td>
                      </tr>
                      <tr>
                        <th scope="row"><label for="applicantDocumentFile3">재학증명서_3</label></th>
                        <td>
                          <div class="flex items-center gap-2 row-type-file">
                            <input
                              id="applicantDocumentFile3"
                              name="applicantDocumentFile3"
                              type="file"
                              class="form-control"
                            />
                            <button
                              type="submit"
                              name="documentType"
                              value="studentCertificate3"
                              class="btn variant-solid color-navy rounded-md size-input"
                            >
                              저장
                            </button>
                          </div>
                        </td>
                      </tr>
                      <tr>
                        <th scope="row"><label for="applicantDocumentFile4">재학증명서_4</label></th>
                        <td>
                          <div class="flex items-center gap-2 row-type-file">
                            <input
                              id="applicantDocumentFile4"
                              name="applicantDocumentFile4"
                              type="file"
                              class="form-control"
                            />
                            <button
                              type="submit"
                              name="documentType"
                              value="studentCertificate4"
                              class="btn variant-solid color-navy rounded-md size-input"
                            >
                              저장
                            </button>
                          </div>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </form>
              </section>
            </section>
          </div>
        </main>
      </div>

      <!-- 관리자 공통 푸터 인클루드 영역: /admin_bak/include/footer.html 파일을 불러옵니다. -->
      <div id="include-admin-footer" data-include="footer"></div>
    </div>
    <script src="/tdwfpub/admin_bak/js/include.js"></script>
    <script src="/tdwfpub/admin_bak/js/admin.js"></script>
  </body>
</html>
