<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>질문과 답변 쓰기 | 화물복지재단 지원신청사업</title>
    <link rel="icon" href="/tdwfpub/common/images/favicon.ico" sizes="any" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link rel="stylesheet" href="/tdwfpub/common/css/apply.css" />
  </head>
  <body data-site="apply" data-section="mypage" data-page="qna">
    <a href="#main" class="skip-link">본문 바로가기</a>

    <!-- 지원신청 헤더 인클루드 영역: common/include/apply/header.html 파일을 불러옵니다. -->
    <div id="include-header" data-include="header-apply"></div>

    <main id="main">
      <div class="breadcrumb-wrap">
        <div class="inner">
          <nav class="breadcrumb" aria-label="현재 위치">
            <ol>
              <li>
                <a href="/tdwfpub/apply/">
                  <span class="material-symbols-rounded" aria-hidden="true">home</span>
                  home
                </a>
              </li>
              <li>
                <a href="/tdwfpub/apply/mypage/application-list.html">마이페이지</a>
              </li>
              <li>
                <a href="/tdwfpub/apply/mypage/qna.html">질문과 답변</a>
              </li>
              <li aria-current="page" data-breadcrumb-current>글 쓰기</li>
            </ol>
          </nav>
        </div>
      </div>

      <div class="sub-content-wrap" data-sub-content-wrap>
        <div class="inner">
          <!-- 마이페이지 LNB 인클루드 영역: common/include/apply/lnb-mypage.html 파일을 불러옵니다. -->
          <div data-include="lnb-apply-mypage" data-page="qna"></div>

          <section aria-labelledby="page-title">
            <div class="sub-content-head">
              <h1 id="page-title" class="sub-page-title">질문과 답변</h1>
              <div class="sub-intro">
                <strong>
                  궁금하신 질문들을 올리시기 전
                  <a href="/tdwfpub/main/archive/faq.html" class="text-blue text-underline">자주하는 질문</a>에서 원하는 내용이 있는지
                  확인해 보세요.
                </strong>
              </div>
            </div>

            <div class="sub-content">
              <form class="board-write-form" action="/tdwfpub/apply/mypage/qna.html" method="post">
                <div class="table-wrap">
                  <table class="board-form-table">
                    <caption>
                      질문과 답변 작성
                    </caption>
                    <colgroup>
                      <col width="24%" />
                      <col width="76%" />
                    </colgroup>
                    <tbody>
                      <tr>
                        <th scope="row">아이디</th>
                        <td>abcdefg12!</td>
                      </tr>
                      <tr>
                        <th scope="row">작성자</th>
                        <td>홍길동</td>
                      </tr>
                      <tr>
                        <th scope="row">
                          <label for="qna-title">제목 <span class="required-mark" aria-hidden="true">*</span></label>
                        </th>
                        <td>
                          <input id="qna-title" class="form-control" type="text" name="title" required />
                        </td>
                      </tr>
                      <tr>
                        <th scope="row">
                          <label for="qna-content">내용 <span class="required-mark" aria-hidden="true">*</span></label>
                        </th>
                        <td>
                          <textarea id="qna-content" class="textarea" name="content" rows="12" required></textarea>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>

                <div class="board-footer-actions type-grid">
                  <button type="submit" class="btn variant-solid color-blue size-lg">등록하기</button>
                  <a href="/tdwfpub/apply/mypage/qna.html" class="btn variant-solid color-navy size-lg">취소하기</a>
                </div>
              </form>
            </div>
          </section>
        </div>
      </div>
    </main>

    <!-- 플로팅 메뉴 인클루드 영역: common/include/apply/floating.html 파일을 불러옵니다. -->
    <div id="include-floating-menu" data-include="floating-apply"></div>

    <!-- 공통 푸터 인클루드 영역: common/include/footer.html 파일을 불러옵니다. -->
    <div id="include-footer" data-include="footer-common"></div>

    <script src="/tdwfpub/common/js/include.js"></script>
    <script src="/tdwfpub/common/js/common.js"></script>
    <script src="/tdwfpub/common/js/apply.js"></script>
  </body>
</html>
