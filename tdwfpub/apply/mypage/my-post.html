<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>내 글 보기 | 화물복지재단 지원신청사업</title>
    <link rel="icon" href="/common/images/favicon.ico" sizes="any" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link rel="stylesheet" href="/common/css/apply.css" />
  </head>
  <body data-site="apply" data-section="mypage" data-page="my-post">
    <a href="#main" class="skip-link">본문 바로가기</a>

    <!-- 지원신청 헤더 인클루드 영역: common/include/apply/header.html 파일을 불러옵니다. -->
    <div id="include-header" data-include="header-apply"></div>

    <main id="main">
      <div class="breadcrumb-wrap">
        <div class="inner">
          <nav class="breadcrumb" aria-label="현재 위치">
            <ol>
              <li>
                <a href="/apply/">
                  <span class="material-symbols-rounded" aria-hidden="true">home</span>
                  home
                </a>
              </li>
              <li>
                <a href="/apply/mypage/application-list.html">마이페이지</a>
              </li>
              <li aria-current="page" data-breadcrumb-current>내 글 보기</li>
            </ol>
          </nav>
        </div>
      </div>

      <div class="sub-content-wrap" data-sub-content-wrap>
        <div class="inner">
          <!-- 마이페이지 LNB 인클루드 영역: common/include/apply/lnb-mypage.html 파일을 불러옵니다. -->
          <div data-include="lnb-apply-mypage" data-page="my-post"></div>

          <section aria-labelledby="page-title">
            <div class="sub-content-head">
              <h1 id="page-title" class="sub-page-title">내 글 보기</h1>
              <div class="sub-intro">
                <strong><em>커뮤니티에 등록한 글</em>을 보실 수 있습니다.</strong>
              </div>
            </div>

            <div class="sub-content">
              <div class="board-area">
                <div class="board-info-row">
                  <label class="sr-only" for="my-post-board">게시판 별로 보기</label>
                  <select class="form-control w-quarter mobile-w-full" id="my-post-board" name="boardType">
                    <option value="">게시판 별로 보기</option>
                  </select>
                </div>

                <div class="board-table-wrap">
                  <table class="board-table">
                    <caption>
                      커뮤니티에 등록한 내 글 목록
                    </caption>
                    <colgroup>
                      <col width="10%" />
                      <col width="50%" />
                      <col width="22%" />
                      <col class="mobile-cell-hidden" width="18%" />
                    </colgroup>
                    <thead>
                      <tr>
                        <th scope="col">번호</th>
                        <th scope="col">제목</th>
                        <th scope="col">게시판구분</th>
                        <th scope="col" class="mobile-cell-hidden">등록일</th>
                      </tr>
                    </thead>
                    <tbody>
                      <!-- 목록 없는 경우: hidden 속성을 제거하고 표시 -->
                      <tr hidden>
                        <td colspan="4" class="board-content-empty">작성한 글이 없습니다.</td>
                      </tr>
                      <!-- 반복: 작성한 글 행 -->
                      <tr>
                        <td>48</td>
                        <td class="board-cell-title">
                          <a href="#" class="truncate">문의드립니다.</a>
                        </td>
                        <td>{게시판명}</td>
                        <td class="mobile-cell-hidden">2026-05-22</td>
                      </tr>
                    </tbody>
                  </table>
                </div>

                <nav class="board-pagination" aria-label="내 글 보기 페이지">
                  <a href="#" class="board-page-button" aria-label="처음 페이지">
                    <span class="material-symbols-rounded board-page-icon" aria-hidden="true">
                      keyboard_double_arrow_left
                    </span>
                  </a>
                  <a href="#" class="board-page-button" aria-label="이전 페이지">
                    <span class="material-symbols-rounded board-page-icon" aria-hidden="true">chevron_left</span>
                  </a>
                  <a href="#" class="board-page-button active" aria-current="page">1</a>
                  <a href="#" class="board-page-button">2</a>
                  <a href="#" class="board-page-button">3</a>
                  <a href="#" class="board-page-button">4</a>
                  <a href="#" class="board-page-button">5</a>
                  <a href="#" class="board-page-button">6</a>
                  <a href="#" class="board-page-button">7</a>
                  <a href="#" class="board-page-button">8</a>
                  <a href="#" class="board-page-button">9</a>
                  <a href="#" class="board-page-button">10</a>
                  <a href="#" class="board-page-button" aria-label="다음 페이지">
                    <span class="material-symbols-rounded board-page-icon" aria-hidden="true">chevron_right</span>
                  </a>
                  <a href="#" class="board-page-button" aria-label="마지막 페이지">
                    <span class="material-symbols-rounded board-page-icon" aria-hidden="true">
                      keyboard_double_arrow_right
                    </span>
                  </a>
                </nav>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>

    <!-- 플로팅 메뉴 인클루드 영역: common/include/apply/floating.html 파일을 불러옵니다. -->
    <div id="include-floating-menu" data-include="floating-apply"></div>

    <!-- 공통 푸터 인클루드 영역: common/include/footer.html 파일을 불러옵니다. -->
    <div id="include-footer" data-include="footer-common"></div>

    <script src="/common/js/include.js"></script>
    <script src="/common/js/common.js"></script>
    <script src="/common/js/apply.js"></script>
  </body>
</html>
