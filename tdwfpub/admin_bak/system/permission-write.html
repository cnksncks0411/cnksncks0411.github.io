<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>권한 수정 | 화물복지재단 관리자</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link rel="stylesheet" href="/tdwfpub/admin_bak/css/admin.css" />
  </head>
  <body data-site="admin" data-section="system" data-page="permission">
    <a href="#admin-content" class="skip-link">본문 바로가기</a>

    <div id="wrap">
      <!-- 관리자 공통 헤더 인클루드 영역: /admin_bak/include/header.html 파일을 불러옵니다. -->
      <div id="include-admin-header" data-include="header"></div>

      <div class="admin-content-wrap" data-layout-body>
        <!-- 시스템관리 좌측 메뉴 인클루드 영역: /admin_bak/include/lnb-system.html 파일을 불러옵니다. -->
        <div id="include-admin-lnb" data-include="lnb-system" data-page="permission"></div>

        <main id="admin-content" data-content>
          <!-- 열린 관리자 페이지 탭 렌더링 영역: 저장된 탭이 있을 때 admin.js에서 목록을 출력합니다. -->
          <nav class="tab-bar" data-tabs data-tab-bar aria-label="열린 관리자 페이지" hidden></nav>

          <div class="content-wrap">
            <div class="page-title">
              <h1>권한 관리</h1>
              <nav class="breadcrumb" aria-label="현재 위치">
                <a href="/tdwfpub/admin_bak/admin-main.html">Home</a>
                <span class="material-symbols-rounded" aria-hidden="true">chevron_forward</span>
                <a href="/tdwfpub/admin_bak/system/permission-list.html">시스템관리</a>
                <span class="material-symbols-rounded" aria-hidden="true">chevron_forward</span>
                <a href="/tdwfpub/admin_bak/system/permission-list.html">권한 관리</a>
                <span class="material-symbols-rounded" aria-hidden="true">chevron_forward</span>
                <span aria-current="page">권한 수정</span>
              </nav>
            </div>

            <section class="panel" aria-labelledby="permission-write-title">
              <h2 class="board-section-title sr-only" id="permission-write-title">권한 수정</h2>
              <form action="/tdwfpub/admin_bak/system/permission-write.html" method="post">
                <table class="board-form-table">
                  <caption>
                    권한 등록 및 수정 정보
                  </caption>
                  <colgroup>
                    <col width="18%" />
                    <col width="82%" />
                  </colgroup>
                  <tbody>
                    <tr>
                      <th scope="row">
                        <label for="permissionCode">권한 코드<span class="required-mark">*</span></label>
                      </th>
                      <td>
                        <input
                          type="text"
                          id="permissionCode"
                          name="permissionCode"
                          class="form-control w-half"
                          value="ROLE_FOUNDATION_COOP_ADMIN"
                          readonly
                          required
                        />
                      </td>
                    </tr>
                    <tr>
                      <th scope="row">
                        <label for="permissionWriteName">권한명<span class="required-mark">*</span></label>
                      </th>
                      <td>
                        <input
                          type="text"
                          id="permissionWriteName"
                          name="permissionWriteName"
                          class="form-control w-half"
                          value="협력업체관리자"
                          required
                        />
                      </td>
                    </tr>
                    <tr>
                      <th scope="row">
                        <label for="permissionDescription">설명<span class="required-mark">*</span></label>
                      </th>
                      <td>
                        <input
                          type="text"
                          id="permissionDescription"
                          name="permissionDescription"
                          class="form-control w-half"
                          value="인터넷망 특정 IP로 접근할 수 있는 관리자"
                          required
                        />
                      </td>
                    </tr>
                    <tr>
                      <th scope="row"><label for="permissionCreatedAt">등록일자</label></th>
                      <td>
                        <input
                          type="text"
                          id="permissionCreatedAt"
                          name="permissionCreatedAt"
                          class="form-control w-half"
                          value="2026-01-14 09:19:06.0"
                          readonly
                        />
                      </td>
                    </tr>
                  </tbody>
                </table>

                <div class="board-info-row align-right mt-2 mb-4 f-14">
                  <span>결과 : <span class="font-bold">정상적으로 조회되었습니다.</span></span>
                </div>

                <div class="board-form-actions">
                  <button type="submit" class="btn variant-soft color-blue rounded-md size-board-action">
                    수정하기
                  </button>
                  <button type="button" class="btn variant-soft color-red rounded-md size-board-action">
                    삭제하기
                  </button>
                  <a
                    href="/tdwfpub/admin_bak/system/permission-list.html"
                    class="btn variant-outline color-navy rounded-md size-board-action"
                  >
                    목록보기
                  </a>
                </div>
              </form>
            </section>
          </div>
        </main>
      </div>

      <!-- 관리자 공통 푸터 인클루드 영역: /admin_bak/include/footer.html 파일을 불러옵니다. -->
      <div id="include-admin-footer" data-include="footer"></div>
    </div>
    <script src="/tdwfpub/admin_bak/js/include.js"></script>
    <script src="/tdwfpub/admin_bak/js/admin.js"></script>
  </body>
</html>
