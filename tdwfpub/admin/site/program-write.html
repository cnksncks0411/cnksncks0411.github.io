<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>화물복지재단 관리자</title>
    <link rel="icon" href="/common/images/favicon.ico" sizes="any" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link rel="stylesheet" href="/admin/css/admin.css" />
  </head>
  <body data-site="admin" data-section="site" data-page="program">
    <a href="#admin-content" class="skip-link">본문 바로가기</a>

    <div id="wrap">
      <!-- 관리자 공통 헤더 인클루드 영역: /admin/include/header.html 파일을 불러옵니다. -->
      <div id="include-admin-header" data-include="header"></div>

      <div class="admin-content-wrap" data-layout-body>
        <!-- 사이트 관리 좌측 메뉴 인클루드 영역: /admin/include/lnb-site.html 파일을 불러옵니다. -->
        <div id="include-admin-lnb" data-include="lnb-site" data-page="program"></div>

        <main id="admin-content" data-content>
          <!-- 열린 관리자 페이지 탭 렌더링 영역: 저장된 탭이 있을 때 admin.js에서 목록을 출력합니다. -->
          <nav class="tab-bar" data-tabs data-tab-bar aria-label="열린 관리자 페이지" hidden></nav>

          <div class="content-wrap">
            <div class="page-title">
              <!-- 수정 화면으로 사용할 경우 '프로그램목록 수정'으로 변경합니다. -->
              <h1>프로그램목록 등록</h1>
              <nav class="breadcrumb" aria-label="현재 위치">
                <a href="/admin/admin-main.html">Home</a>
                <span class="material-symbols-rounded" aria-hidden="true">chevron_forward</span>
                <a href="/admin/site/popup-list.html">사이트 관리</a>
                <span class="material-symbols-rounded" aria-hidden="true">chevron_forward</span>
                <a href="/admin/site/program-list.html">프로그램목록관리</a>
                <span class="material-symbols-rounded" aria-hidden="true">chevron_forward</span>
                <span aria-current="page">프로그램목록 등록</span>
              </nav>
            </div>

            <section class="panel" aria-labelledby="program-write-title">
              <form action="/admin/site/program-write.html" method="post">
                <table class="board-form-table">
                  <caption>
                    프로그램 목록 정보
                  </caption>
                  <colgroup>
                    <col width="20%" />
                    <col width="80%" />
                  </colgroup>
                  <tbody>
                    <tr>
                      <th scope="row">
                        <label for="programFileName">
                          프로그램파일명<span class="required-mark">*</span>
                        </label>
                      </th>
                      <td>
                        <div class="flex items-center gap-2 row-type-field">
                          <input
                            type="text"
                            id="programFileName"
                            name="programFileName"
                            class="form-control"
                            value="M9080100"
                            required
                          />
                          <span class="board-form-note">메뉴리스트 화면에서 참조되는 ID입니다.</span>
                        </div>
                      </td>
                    </tr>
                    <tr>
                      <th scope="row">
                        <label for="programName">프로그램명<span class="required-mark">*</span></label>
                      </th>
                      <td>
                        <input
                          type="text"
                          id="programName"
                          name="programName"
                          class="form-control w-full"
                          value="근골격계지원사업"
                          required
                        />
                      </td>
                    </tr>
                    <tr>
                      <th scope="row">
                        <label for="programMenuType">메뉴유형<span class="required-mark">*</span></label>
                      </th>
                      <td>
                        <select id="programMenuType" name="programMenuType" class="form-control w-half" required>
                          <option value="">선택</option>
                          <option value="">재단홈</option>
                          <option value="">사업신청</option>
                          <option value="">협력업체</option>
                          <option value="" selected>관리자</option>
                          <option value="">사용자공통</option>
                        </select>
                      </td>
                    </tr>
                    <tr>
                      <th scope="row">
                        <label for="programSavePath">저장경로<span class="required-mark">*</span></label>
                      </th>
                      <td>
                        <input
                          type="text"
                          id="programSavePath"
                          name="programSavePath"
                          class="form-control w-full"
                          value="/closed-performance/"
                          required
                        />
                      </td>
                    </tr>
                    <tr>
                      <th scope="row">
                        <label for="programUrl">URL<span class="required-mark">*</span></label>
                      </th>
                      <td>
                        <input
                          type="text"
                          id="programUrl"
                          name="programUrl"
                          class="form-control w-full"
                          value="/admin/basic/application-doc-list.html"
                          required
                        />
                      </td>
                    </tr>
                    <tr>
                      <th scope="row"><label for="programDescription">프로그램설명</label></th>
                      <td>
                        <textarea
                          id="programDescription"
                          name="programDescription"
                          class="textarea"
                          rows="3"
                        >근골격계지원사업</textarea>
                      </td>
                    </tr>
                    <!-- 연결된 메뉴: 수정 화면에서만 노출합니다. 등록 화면에서는 이 행을 제거합니다. -->
                    <tr>
                      <th scope="row">연결된 메뉴</th>
                      <td>실적관리(종료사업) &gt; 근골격계지원사업 ( 사용중 )</td>
                    </tr>
                  </tbody>
                </table>

                <div class="board-form-actions">
                  <!-- 등록 화면에서만 노출 -->
                  <button type="submit" class="btn variant-solid color-navy rounded-md size-board-action">
                    등록하기
                  </button>

                  <!-- 여기부터 수정 화면에서만 노출 -->
                  <button type="submit" class="btn variant-soft color-blue rounded-md size-board-action">
                    수정하기
                  </button>
                  <button type="button" class="btn variant-soft color-red rounded-md size-board-action">
                    삭제하기
                  </button>
                  <!-- 복사하여 신규등록: 메뉴유형·저장경로·URL·프로그램설명 값을 등록 화면에 자동 입력 -->
                  <button type="button" class="btn variant-solid color-blue rounded-md size-board-action">
                    복사하여 신규등록
                  </button>
                  <!-- 수정 화면에서만 노출 끝 -->

                  <!-- 등록/수정 공통 -->
                  <a
                    href="/admin/site/program-list.html"
                    class="btn variant-outline color-navy rounded-md size-board-action"
                  >
                    목록보기
                  </a>
                </div>
              </form>
            </section>
          </div>
        </main>
      </div>

      <!-- 관리자 공통 푸터 인클루드 영역: /admin/include/footer.html 파일을 불러옵니다. -->
      <div id="include-admin-footer" data-include="footer"></div>
    </div>
    <script src="/admin/js/include.js"></script>
    <script src="/admin/js/admin.js"></script>
  </body>
</html>
