<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>회원탈퇴 | 화물복지재단 지원신청사업</title>
    <link rel="icon" href="/tdwfpub/common/images/favicon.ico" sizes="any" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link rel="stylesheet" href="/tdwfpub/common/css/apply.css" />
  </head>
  <body data-site="apply" data-section="mypage" data-page="member-withdrawal">
    <a href="#main" class="skip-link">본문 바로가기</a>

    <!-- 지원신청 헤더 인클루드 영역: common/include/apply/header.html 파일을 불러옵니다. -->
    <div id="include-header" data-include="header-apply"></div>

    <main id="main">
      <div class="breadcrumb-wrap">
        <div class="inner">
          <nav class="breadcrumb" aria-label="현재 위치">
            <ol>
              <li>
                <a href="/tdwfpub/apply/">
                  <span class="material-symbols-rounded" aria-hidden="true">home</span>
                  home
                </a>
              </li>
              <li>
                <a href="/tdwfpub/apply/mypage/application-list.html">마이페이지</a>
              </li>
              <li aria-current="page" data-breadcrumb-current>회원탈퇴</li>
            </ol>
          </nav>
        </div>
      </div>

      <div class="sub-content-wrap" data-sub-content-wrap>
        <div class="inner">
          <!-- 마이페이지 LNB 인클루드 영역: 회원 정보 메뉴를 활성화합니다. -->
          <div data-include="lnb-apply-mypage" data-page="member-info"></div>

          <section aria-labelledby="page-title">
            <div class="sub-content-head">
              <h1 id="page-title" class="sub-page-title">회원정보</h1>
              <div class="sub-intro">
                <strong><em>회원탈퇴</em></strong>
              </div>
            </div>

            <div class="sub-content member-info-content">
              <div class="member-info-edit">
                <p class="member-info-required">
                  <span class="required-mark" aria-hidden="true">*</span> 표시는 필수 입력 항목입니다.
                </p>

                <form class="member-info-edit-form" action="#" method="post">
                  <div class="table-wrap">
                    <table class="board-form-table">
                      <caption>
                        회원탈퇴 정보 입력
                      </caption>
                      <colgroup>
                        <col width="24%" />
                        <col width="76%" />
                      </colgroup>
                      <tbody>
                        <tr>
                          <th scope="row">아이디</th>
                          <td><span class="member-info-value">abc123</span></td>
                        </tr>
                        <tr>
                          <th scope="row">이름</th>
                          <td><span class="member-info-value">홍길동</span></td>
                        </tr>
                        <tr>
                          <th scope="row">
                            <label for="member-withdrawal-password">
                              <span class="required-mark" aria-hidden="true">*</span> 비밀번호
                            </label>
                          </th>
                          <td>
                            <input
                              type="password"
                              class="form-control member-info-control"
                              id="member-withdrawal-password"
                              name="password"
                              autocomplete="current-password"
                              placeholder="비밀번호를 입력하세요."
                              required
                            />
                          </td>
                        </tr>
                        <tr>
                          <th scope="row">
                            <label for="member-withdrawal-reason">
                              <span class="required-mark" aria-hidden="true">*</span> 회원탈퇴 사유
                            </label>
                          </th>
                          <td>
                            <div class="member-info-form-cell">
                              <select
                                class="form-control"
                                id="member-withdrawal-reason"
                                name="withdrawalReason"
                                required
                              >
                                <option value="">선택</option>
                                <option value="service-error">잦은 서비스 오류 및 장애</option>
                                <option value="infrequent-use">자주이용하지 않음</option>
                                <option value="privacy-violation">개인정보/사생활 침해 사례경험</option>
                                <option value="rejoin">개인정보 변경으로 인한 재가입</option>
                                <option value="other">기타</option>
                              </select>

                              <label class="sr-only" for="member-withdrawal-reason-detail">
                                회원탈퇴 사유 상세내용
                              </label>
                              <textarea
                                class="textarea"
                                id="member-withdrawal-reason-detail"
                                name="withdrawalReasonDetail"
                                rows="6"
                              ></textarea>
                            </div>
                          </td>
                        </tr>
                      </tbody>
                    </table>
                  </div>

                  <div class="board-footer-actions member-withdrawal-actions">
                    <button type="submit" class="btn variant-solid color-blue size-lg">회원탈퇴</button>
                  </div>
                </form>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>

    <!-- 플로팅 메뉴 인클루드 영역: common/include/apply/floating.html 파일을 불러옵니다. -->
    <div id="include-floating-menu" data-include="floating-apply"></div>

    <!-- 공통 푸터 인클루드 영역: common/include/footer.html 파일을 불러옵니다. -->
    <div id="include-footer" data-include="footer-common"></div>

    <script src="/tdwfpub/common/js/include.js"></script>
    <script src="/tdwfpub/common/js/common.js"></script>
    <script src="/tdwfpub/common/js/apply.js"></script>
  </body>
</html>
