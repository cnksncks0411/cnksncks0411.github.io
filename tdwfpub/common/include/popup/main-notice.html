<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>사이트 안내 | 화물복지재단</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link rel="stylesheet" href="/tdwfpub/common/css/base/base.css" />
    <link rel="stylesheet" href="/tdwfpub/common/css/base/btn.css" />
    <link rel="stylesheet" href="/tdwfpub/common/css/base/common.css" />
  </head>
  <body class="notice-popup">
    <main>
      <!-- 팝업 이미지와 대체 텍스트 교체 -->
      <a href="#" class="notice-image" aria-label="사이트 안내 자세히 보기">
        <img src="/tdwfpub/common/images/apply/rs_homepage_guide.png" alt="사이트 안내" />
      </a>

      <div class="notice-footer">
        <label class="check-label">
          <input type="checkbox" data-notice-today />
          <span class="check-label-text">오늘 하루 더 보지 않기</span>
        </label>

        <div class="notice-buttons">
          <a href="#" class="btn variant-outline color-navy size-md rounded-md">
            <span class="btn-label">자세히 보기</span>
          </a>
          <button type="button" class="btn variant-solid color-navy size-md rounded-md" data-close>
            <span class="btn-label">닫기</span>
          </button>
        </div>
      </div>
    </main>

    <script src="/tdwfpub/common/js/common.js"></script>
  </body>
</html>
