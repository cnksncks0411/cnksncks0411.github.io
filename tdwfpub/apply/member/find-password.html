<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>비밀번호 찾기 | 지원신청사업</title>
    <link rel="icon" href="/tdwfpub/common/images/favicon.ico" sizes="any" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link rel="stylesheet" href="/tdwfpub/common/css/apply.css" />
  </head>
  <body data-site="apply" data-section="member" data-page="find-password">
    <a href="#main" class="skip-link">본문 바로가기</a>

    <!-- 지원신청 헤더 인클루드 영역: common/include/apply/header.html 파일을 불러옵니다. -->
    <div id="include-header" data-include="header-apply"></div>

    <main id="main">
      <div class="breadcrumb-wrap">
        <div class="inner">
          <nav class="breadcrumb" aria-label="현재 위치">
            <ol>
              <li>
                <a href="/tdwfpub/apply/">
                  <span class="material-symbols-rounded" aria-hidden="true">home</span>
                  home
                </a>
              </li>
              <li aria-current="page" data-breadcrumb-current>비밀번호 찾기</li>
            </ol>
          </nav>
        </div>
      </div>

      <div class="sub-content-wrap" data-sub-content-wrap>
        <div class="inner">
          <!-- 회원 LNB 인클루드 영역: common/include/apply/lnb-member.html 파일을 불러옵니다. -->
          <div data-include="lnb-apply-member" data-page="find-password"></div>

          <section aria-labelledby="page-title">
            <div class="sub-content-head">
              <h1 id="page-title" class="sub-page-title">비밀번호 찾기</h1>
              <div class="sub-intro">
                <p>비밀번호를 찾고자 하는 아이디를 입력해 주세요.</p>
              </div>
            </div>

            <div class="sub-content find-password-content">
              <nav class="sub-tab-list grid-cols-2" aria-label="회원정보 찾기 메뉴">
                <a href="/tdwfpub/apply/member/find-id.html" class="sub-tab-item">아이디 찾기</a>
                <a href="/tdwfpub/apply/member/find-password.html" class="sub-tab-item active" aria-current="page">비밀번호 찾기</a>
              </nav>

              <div class="auth-password-guide">
                <span class="material-symbols-rounded" aria-hidden="true">account_circle</span>
                <p>비밀번호를 찾고자 하는 아이디를 입력해 주세요.</p>
              </div>

              <div class="auth-password-panel">
                <form class="auth-password-form" action="/tdwfpub/apply/member/find-password-result.html" method="get">
                  <label for="password-find-id">아이디</label>
                  <input
                    id="password-find-id"
                    class="form-control size-lg"
                    type="text"
                    name="userId"
                    autocomplete="username"
                    placeholder="아이디를 입력하세요."
                    required
                  />
                  <!--
                    퍼블리싱 팝업 확인 용 버튼. 클릭 시 로그인메세지 팝업창 열림
                  -->
                  <a
                    href="/tdwfpub/apply/popup/login-message.html"
                    target="_blank"
                    rel="noopener"
                    class="btn variant-solid color-blue size-lg"
                    data-popup="loginMessagePopup"
                    data-size="560,300"
                  >
                    <span class="btn-label">다음</span>
                  </a>
                  <!-- 
                    <button type="submit" class="btn variant-solid color-blue size-lg">
                      <span class="btn-label">다음</span>
                    </button> 
                  -->
                </form>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>

    <!-- 플로팅 메뉴 인클루드 영역: common/include/apply/floating.html 파일을 불러옵니다. -->
    <div id="include-floating-menu" data-include="floating-apply"></div>

    <!-- 공통 푸터 인클루드 영역: common/include/footer.html 파일을 불러옵니다. -->
    <div id="include-footer" data-include="footer-common"></div>

    <script src="/tdwfpub/common/js/include.js"></script>
    <script src="/tdwfpub/common/js/common.js"></script>
    <script src="/tdwfpub/common/js/apply.js"></script>
  </body>
</html>
