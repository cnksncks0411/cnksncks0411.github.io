<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>선발부문별 지원현황 | 화물복지재단 관리자</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link rel="stylesheet" href="/admin/css/admin.css" />
  </head>
  <body data-site="admin" data-section="regular" data-page="field-status">
    <a href="#admin-content" class="skip-link">본문 바로가기</a>

    <div id="wrap">
      <!-- 관리자 공통 헤더 인클루드 영역: /admin/include/header.html 파일을 불러옵니다. -->
      <div id="include-admin-header" data-include="header"></div>

      <div class="admin-content-wrap" data-layout-body>
        <!-- 정기사업관리 좌측 메뉴 인클루드 영역: /admin/include/lnb-regular.html 파일을 불러옵니다. -->
        <div id="include-admin-lnb" data-include="lnb-regular" data-page="field-status"></div>

        <main id="admin-content" data-content>
          <!-- 열린 관리자 페이지 탭 렌더링 영역: 저장된 탭이 있을 때 admin.js에서 목록을 출력합니다. -->
          <nav class="tab-bar" data-tabs data-tab-bar aria-label="열린 관리자 페이지" hidden></nav>

          <div class="content-wrap">
            <div class="page-title">
              <h1>선발부문별 지원현황</h1>
              <nav class="breadcrumb" aria-label="현재 위치">
                <a href="/admin/admin-main.html">Home</a>
                <span class="material-symbols-rounded" aria-hidden="true">chevron_forward</span>
                <a href="/admin/regular/evaluation-list.html">정기사업관리</a>
                <span class="material-symbols-rounded" aria-hidden="true">chevron_forward</span>
                <span aria-current="page">선발부문별 지원현황</span>
              </nav>
            </div>

            <div class="board-search-row justify-between">
              <form
                class="board-search-form type-select"
                role="search"
                action="/admin/regular/field-status.html"
                method="get"
              >
                <select id="fieldStatusNotice" name="notice" class="form-control" aria-label="공고 선택">
                  <option value="">--- 공고 선택 ---</option>
                </select>
                <button type="submit" class="btn variant-solid color-navy rounded-md size-board-action">조회</button>
              </form>
              <button type="button" class="btn variant-outline color-navy rounded-md size-board-auto">
                <span class="material-symbols-rounded" aria-hidden="true">download</span>
                엑셀 다운로드
              </button>
            </div>

            <section class="panel" aria-label="선발부문별 지원현황 목록">
              <div class="board-table-wrap">
                <table class="board-table">
                  <caption>
                    선발부문별 지원현황 목록
                  </caption>
                  <colgroup>
                    <col width="17%" />
                    <col width="10%" />
                    <col width="10%" />
                    <col width="10%" />
                    <col width="21%" />
                    <col width="8%" />
                    <col width="8%" />
                    <col width="8%" />
                    <col width="8%" />
                  </colgroup>
                  <thead>
                    <tr>
                      <th scope="col" rowspan="2">
                        <button
                          type="button"
                          class="btn-table-sort"
                          aria-pressed="false"
                          aria-label="사업부문 정렬 방향 변경"
                          data-table-sort
                        >
                          <span>사업부문</span>
                          <span class="material-symbols-rounded" aria-hidden="true">keyboard_arrow_down</span>
                        </button>
                      </th>
                      <th scope="col" rowspan="2">모집인원</th>
                      <th scope="col" rowspan="2">지원인원</th>
                      <th scope="col" rowspan="2">지원비율</th>
                      <th scope="col" rowspan="2">선발부문명</th>
                      <th scope="col" rowspan="2">모집인원</th>
                      <th scope="col" rowspan="2">지원인원</th>
                      <th scope="colgroup" colspan="2">지원비율</th>
                    </tr>
                    <tr>
                      <th scope="col">모집대비</th>
                      <th scope="col">전체대비</th>
                    </tr>
                  </thead>
                  <tbody>
                    <!-- 목록 없는 경우: hidden 속성을 제거하고 표시 -->
                    <tr hidden>
                      <td colspan="9" class="board-content-empty">등록된 선발부문별 지원현황이 없습니다.</td>
                    </tr>
                    <!-- 반복: 선발부문별 지원현황 행 -->
                    <tr>
                      <td>일반장학사업</td>
                      <td>6,731</td>
                      <td>6,735</td>
                      <td>100.06</td>
                      <td>중학생-한부모가정</td>
                      <td>43</td>
                      <td>50</td>
                      <td>116.28</td>
                      <td>0.74</td>
                    </tr>
                    <tr>
                      <td>일반장학사업</td>
                      <td>6,731</td>
                      <td>6,735</td>
                      <td>100.06</td>
                      <td>고등학생-한부모가정</td>
                      <td>12</td>
                      <td>21</td>
                      <td>175</td>
                      <td>0.31</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </section>
          </div>
        </main>
      </div>

      <!-- 관리자 공통 푸터 인클루드 영역: /admin/include/footer.html 파일을 불러옵니다. -->
      <div id="include-admin-footer" data-include="footer"></div>
    </div>

    <script src="/admin/js/include.js"></script>
    <script src="/admin/js/admin.js"></script>
  </body>
</html>
