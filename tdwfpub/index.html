<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>화물복지재단 대문</title>
    <link rel="icon" href="/common/images/favicon.ico" sizes="any" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link rel="stylesheet" href="/common/css/intro.css" />
  </head>
  <body>
    <a href="#main" class="skip-link">본문 바로가기</a>

    <main id="main" class="intro-main" aria-labelledby="intro-title">
      <section class="intro-wrap">
        <div class="intro-brand">
          <h1 id="intro-title" class="brand-logo">
            <img src="/common/images/logo.png" alt="" class="brand-logo-mark" />
            <span class="brand-logo-text">화물복지재단</span>
          </h1>
        </div>

        <div class="intro-card-wrap">
          <!-- 반복: 인트로 카드 -->
          <a class="intro-card" href="/apply/">
            <div class="intro-title">
              <span class="intro-no" aria-hidden="true">01</span>
              <h2>복지사업신청</h2>
            </div>
            <div class="intro-body">
              <span class="btn variant-solid color-gradient rounded-full"
                ><span class="btn-label">신청하러 가기 <span aria-hidden="true">→</span></span></span
              >
            </div>
          </a>
          <a class="intro-card" href="/main/">
            <div class="intro-title">
              <span class="intro-no" aria-hidden="true">02</span>
              <h2>재단소개</h2>
            </div>
            <div class="intro-body">
              <span class="btn variant-solid color-gradient rounded-full"
                ><span class="btn-label">바로가기 <span aria-hidden="true">→</span></span></span
              >
            </div>
          </a>
        </div>
      </section>
    </main>

    <!-- 공통 푸터 인클루드 영역: common/include/footer.html 파일을 불러옵니다. -->
    <div id="include-footer" data-include="footer-common"></div>

    <script src="/common/js/include.js"></script>
    <script src="/common/js/common.js"></script>
  </body>
</html>
